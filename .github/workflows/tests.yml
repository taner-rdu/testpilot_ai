name: UI tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Run tests
        run: >
          uv run pytest
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results

      - name: Publish summary
        if: always()
        run: uv run python scripts/summary.py reports/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  ai-investigation:
    needs: playwright
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ github.head_ref }}
      FIX_BRANCH: ai-fix/${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: failure-report/

      - name: AI investigates and fixes
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --mcp-config .github/ai/mcp.json
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(uv run pytest:*),Bash(git diff:*),mcp__playwright__*"
            --model claude-haiku-5-5
            --max-turns 30
          prompt: "Read .github/ai/investigate.md and follow its instructions exactly."

      - name: Open draft PR with the fix
        run: |
          if git diff --quiet; then
            echo "Agent made no changes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "testpilot-ai[bot]"
          git config user.email "testpilot-ai@users.noreply.github.com"
          git checkout -b "$FIX_BRANCH"
          git add -- tests/
          git commit -m "AI fix: repair failing UI tests"
          git push --force origin "$FIX_BRANCH"
          gh pr create --draft --base "$PR_BRANCH" --head "$FIX_BRANCH" \
            --title "🤖 AI fix for failing tests on $PR_BRANCH" \
            --body-file ai-explanation.md
          echo "Draft PR opened for human review." >> "$GITHUB_STEP_SUMMARY"
