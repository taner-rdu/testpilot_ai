[project]
name = "testpilot-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--base-url=https://practice.expandtesting.com"
